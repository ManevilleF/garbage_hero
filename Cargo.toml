[package]
name = "garbage_project"
version = "0.2.0"
edition = "2024"

[features]
default = []
debug_physics = ["avian3d/debug-plugin"]
debug = [
    "bevy_egui",
    "bevy-inspector-egui",
    "bevy/file_watcher",
    "bevy/bevy_dev_tools",
]
debug_world = ["debug"]

[dependencies]
# Enum iter
strum = { version = "0.26", features = ["derive"] }
# Input map
leafwing-input-manager = "0.20"
bevy_enhanced_input = "0.24"
# PRNG
rand = "0.9"
# errors
thiserror = "2.0"

# Physics
[dependencies.avian3d]
version = "0.6"
default-features = false
features = ["3d", "f32", "parry-f32", "parallel", "simd"]

[dependencies.bevy_mod_outline]
version = "0.12"
default-features = false
features = ["scene"]

# particles
[dependencies.bevy_hanabi]
version = "0.18"
default-features = false
features = ["3d"]

[dependencies.bevy]
version = "0.18"
default-features = false
features = [
    "3d",
    "ui"
]

[dependencies.bevy-inspector-egui]
version = "0.36"
features = ["highlight_changes"]
optional = true

[dependencies.bevy_egui]
version = "0.39"
optional = true

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "=0.2.118"

# Enable max optimizations for dependencies, but not for our code:
[profile.dev.package."*"]
opt-level = 3

# Enable only a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "debuginfo"
